<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thought School — Documents</title>
    <link rel="stylesheet" href="styles.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <header>
            <div class="tagline">Thought School</div>
            <h1>Documents Library</h1>
        </header>

        <div id="grid" class="documents-grid">
            <div class="loading">Loading documents...</div>
        </div>

        <div class="instructions">
            <h2>How to update</h2>
            <p>Add files to the <code>documents/</code> folder and update <code>manifest.txt</code> to add new cards.</p>
        </div>
    </div>

    <script>
        async function loadDocuments() {
            const grid = document.getElementById('grid');
            
            try {
                // Add a timestamp to prevent caching of the manifest
                const response = await fetch('manifest.txt?t=' + new Date().getTime());
                
                if (!response.ok) {
                    throw new Error('Could not load manifest.txt');
                }

                const text = await response.text();
                const lines = text.split('\n');
                
                // Clear loading state
                grid.innerHTML = '';

                let hasDocs = false;

                lines.forEach(line => {
                    // Skip empty lines
                    if (!line.trim()) return;

                    // Parse format: filename|Title|Description
                    const parts = line.split('|');
                    if (parts.length < 2) return;

                    const filename = parts[0].trim();
                    const title = parts[1].trim();
                    const description = parts[2] ? parts[2].trim() : '';
                    
                    hasDocs = true;
                    createCard(grid, filename, title, description);
                });

                if (!hasDocs) {
                    grid.innerHTML = '<div class="loading">No documents found in manifest.txt</div>';
                }

            } catch (err) {
                console.error(err);
                grid.innerHTML = `
                    <div class="error">
                        <h3>Unable to load documents</h3>
                        <p>Please check that manifest.txt exists and is formatted correctly.</p>
                    </div>
                `;
            }
        }

        function createCard(container, filename, title, description) {
            const card = document.createElement('div');
            card.className = 'card';
            
            const filePath = `documents/${filename}`;

            card.innerHTML = `
                <h3 class="card-title">${escapeHtml(title)}</h3>
                <p class="card-description">${escapeHtml(description)}</p>
                <div class="card-actions">
                    <a href="${filePath}" target="_blank" class="btn btn-outline">Open</a>
                    <a href="${filePath}" download class="btn btn-primary">Download</a>
                </div>
            `;

            container.appendChild(card);
        }

        function escapeHtml(unsafe) {
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', loadDocuments);
    </script>
</body>
</html>
